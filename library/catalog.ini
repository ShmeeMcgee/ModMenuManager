; Mod Menu Manager menu library
; Each [section] is one download. format = zip (a package with menu.ini)
; or xex (a plugin downloaded from its author's own release).

[library]
name    = Shmees Menu Library
updated = 2026-11-22

[shmees-menu-cod4]
name        = Shmees Menu
game        = COD4
version     = 1.0
author      = Shmees
type        = files
format      = zip
mode        = Multiplayer
launch      = default_mp.xex
requires    = codxe
tu          = TU4
license     = MIT
size        = 8 KB
folder      = Shmees Menu
description = Shmees' own mod menu: god mode, infinite ammo, UFO, every base weapon, all perks, explosive bullets, lobby controls and player options. Aim + Knife to open.
url         = https://raw.githubusercontent.com/ShmeeMcgee/ModMenuManager/main/library/packages/shmees-menu-cod4.zip

